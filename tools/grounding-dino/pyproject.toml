[project]
name = "grounding-dino-tool-bundle"
version = "0.1.0.dev0"
description = "Grounding-DINO zero-shot detection. Runs out-of-process via gap_core.rpc.server (needs GPU)."
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "graph-as-policy-core",
  # Model weights load via transformers; torch backs the inference path.
  "torch>=2.7",
  # transformers' GroundingDinoProcessor.post_process calls torchvision::nms
  # internally — pin torchvision so the matching op kernel is present (without
  # it transformers imports OK but post-process raises
  # "operator torchvision::nms does not exist" at first detection call).
  "torchvision>=0.22",
  "transformers>=4.41",
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

# Paper-replication source root: immutable Recast commit and gap-core tree.
[tool.uv.sources]
graph-as-policy-core = { git = "https://github.com/xbillowy/recast", rev = "32b00d4be2efcd2564cd95ab70bed990cfbb016e", subdirectory = "gap-core" }
